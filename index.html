<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Reading Club • Scripture Flashcards</title><style>:root{font-family:system-ui,sans-serif;color:#25362d;background:#f5f7f2}body{margin:0}main{max-width:680px;margin:auto;padding:24px 16px}h1{margin-bottom:4px}.muted{color:#617167}.panel{background:white;border:1px solid #dce5dc;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #20302009}select,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #cbd8cc;background:white}button{cursor:pointer}button.primary{background:#255d45;color:white;border-color:#255d45}.controls{display:flex;gap:8px;flex-wrap:wrap}.card{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:#f0f7f1;border:2px solid #b7d1bd;border-radius:18px;padding:20px;margin:16px 0;font-size:1.3rem;font-weight:600;white-space:pre-wrap}.small{font-size:.9rem}button:focus-visible,.card:focus-visible{outline:3px solid #e7a632}footer{margin-top:30px;color:#617167;font-size:.85rem}</style></head><body><main><h1>📖 Bible Reading Club</h1><p class="muted" id="subtitle">Scripture Memorization • Growing Collection</p><section class="panel"><label for="lang" id="langlabel">Choose your language</label><p><select id="lang"><option value="en">🇺🇸 English</option><option value="fr">🇫🇷 Français</option><option value="ht">🇭🇹 Kreyòl Ayisyen</option></select></p><label for="week" id="weeklabel">Choose a collection</label><p><select id="week"><option value="all">All weeks</option><option value="w1">Week 1 — Exodus 34:6</option></select></p></section><section class="panel"><h2 id="heading">Week 1 — Exodus 34:6</h2><p class="muted small" id="counter"></p><div class="card" role="button" tabindex="0" id="card" aria-label="Flip flashcard"></div><div class="controls"><button id="flip" class="primary">Flip card</button><button id="know">✓ I know it</button><button id="again">× Practice again</button></div><p id="progress" class="muted small"></p><div class="controls"><button id="prev">← Previous</button><button id="next">Next →</button><button id="reset">Reset my progress</button></div></section><footer id="note">Progress is saved only in this browser on this device. Exact Bible verse text is not reproduced; use your preferred Bible translation to study the full passage.</footer></main><script>
const translations={en:{subtitle:'Scripture Memorization • Growing Collection',langlabel:'Choose your language',weeklabel:'Choose a collection',all:'All weeks',week:'Week 1 — Exodus 34:6',flip:'Flip card',know:'✓ I know it',again:'× Practice again',prev:'← Previous',next:'Next →',reset:'Reset my progress',counter:'Card',progress:'Known',of:'of',note:'Progress is saved only in this browser on this device. Exact Bible verse text is not reproduced; use your preferred Bible translation to study the full passage.',confirm:'Reset all your progress?'},fr:{subtitle:'Mémorisation biblique • Collection évolutive',langlabel:'Choisissez votre langue',weeklabel:'Choisissez une collection',all:'Toutes les semaines',week:'Semaine 1 — Exode 34:6',flip:'Retourner la carte',know:'✓ Je connais',again:'× À revoir',prev:'← Précédente',next:'Suivante →',reset:'Effacer mes progrès',counter:'Carte',progress:'Connues',of:'sur',note:'Les progrès sont enregistrés uniquement dans ce navigateur. Consultez votre traduction biblique préférée pour le texte intégral.',confirm:'Effacer tous vos progrès ?'},ht:{subtitle:'Aprann vèsè biblik • Koleksyon k ap grandi',langlabel:'Chwazi lang ou',weeklabel:'Chwazi yon koleksyon',all:'Tout semèn yo',week:'Semèn 1 — Egzòd 34:6',flip:'Vire kat la',know:'✓ Mwen konnen l',again:'× Pratike ankò',prev:'← Anvan',next:'Apre →',reset:'Efase pwogrè mwen',counter:'Kat',progress:'Mwen konnen',of:'sou',note:'Pwogrè a rete sèlman nan navigatè sa a sou aparèy sa a. Li vèsè konplè a nan tradiksyon Bib ou prefere a.',confirm:'Efase tout pwogrè ou?'}};
const cards=[
{en:['Who describes God’s character in Exodus 34:6?','The LORD Himself, speaking to Moses.'],fr:['Qui décrit le caractère de Dieu dans Exode 34:6 ?','Le Seigneur lui-même, devant Moïse.'],ht:['Kilès ki dekri karaktè Bondye nan Egzòd 34:6?','Se Seyè a li menm, devan Moyiz.']},
{en:['Who was present when the LORD proclaimed His name?','Moses.'],fr:['Qui était présent lorsque le Seigneur proclama son nom ?','Moïse.'],ht:['Kilès ki te la lè Seyè a te pwoklame non li?','Moyiz.']},
{en:['What is the first quality of God mentioned?','Compassionate.'],fr:['Quelle est la première qualité de Dieu mentionnée ?','Compatissant.'],ht:['Ki premye kalite Bondye yo site a?','Li gen konpasyon.']},
{en:['What quality follows compassion?','Gracious.'],fr:['Quelle qualité vient après la compassion ?','Il fait grâce.'],ht:['Ki kalite ki vini apre konpasyon?','Li gen pitye e li fè gras.']},
{en:['How does Exodus 34:6 describe God’s anger?','Slow to anger.'],fr:['Comment Exode 34:6 décrit-il la colère de Dieu ?','Il est lent à la colère.'],ht:['Kijan Egzòd 34:6 dekri kòlè Bondye?','Li pa fè kòlè fasil.']},
{en:['What does God abound in?','Love and faithfulness.'],fr:['En quoi Dieu abonde-t-il ?','En amour et en fidélité.'],ht:['Nan ki sa Bondye gen anpil?','Nan lanmou ak fidelite.']},
{en:['What does “slow to anger” teach us?','God is patient.'],fr:['Que nous apprend « lent à la colère » ?','Dieu est patient.'],ht:['Kisa « pa fè kòlè fasil » montre nou?','Bondye gen pasyans.']},
{en:['What five qualities appear in Exodus 34:6?','Compassion, grace, patience, love, faithfulness.'],fr:['Quelles sont les cinq qualités d’Exode 34:6 ?','Compassion, grâce, patience, amour, fidélité.'],ht:['Ki senk kalite ki nan Egzòd 34:6?','Konpasyon, gras, pasyans, lanmou, fidelite.']},
{en:['Which Bible verse are we memorizing?','Exodus 34:6.'],fr:['Quel verset mémorisons-nous ?','Exode 34:6.'],ht:['Ki vèsè n ap aprann pa kè?','Egzòd 34:6.']},
{en:['Why is this declaration especially meaningful?','God reveals His own character.'],fr:['Pourquoi cette déclaration est-elle importante ?','Dieu révèle lui-même son caractère.'],ht:['Poukisa deklarasyon sa a enpòtan?','Bondye revele karaktè li li menm.']}
];
const $=id=>document.getElementById(id);let lang=localStorage.getItem('brc_lang')||'en',index=0,flipped=false,progress=JSON.parse(localStorage.getItem('brc_progress')||'{}');$('lang').value=lang;
function render(){const t=translations[lang];for(const key of ['subtitle','langlabel','weeklabel','flip','know','again','prev','next','reset','note'])$(key).textContent=t[key];$('week').options[0].textContent=t.all;$('week').options[1].textContent=t.week;$('heading').textContent=t.week;$('counter').textContent=`${t.counter} ${index+1} ${t.of} ${cards.length}`;$('card').textContent=cards[index][lang][flipped?1:0];$('progress').textContent=`${t.progress}: ${Object.values(progress).filter(x=>x==='known').length} ${t.of} ${cards.length}`;document.documentElement.lang=lang;}
function flip(){flipped=!flipped;render()}function move(d){index=(index+d+cards.length)%cards.length;flipped=false;render()}function mark(value){progress[index]=value;localStorage.setItem('brc_progress',JSON.stringify(progress));move(1)}$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('brc_lang',lang);render()};$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('know').onclick=()=>mark('known');$('again').onclick=()=>mark('again');$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>{if(confirm(translations[lang].confirm)){progress={};localStorage.removeItem('brc_progress');render()}};render();
</script></body></html>
